<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탁구 복식 매치 대시보드</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="dashboard-header" id="dashboard-header">
            <div class="header-top">
                <div style="display:flex; flex-direction:column; gap:0.2rem;">
                    <h1>🏓 핑퐁 복식 슈퍼리그</h1>
                    <div id="completed-games-count" style="font-size:0.8rem; color:var(--accent-blue); font-weight:bold;">완료된 게임: 0 / 10게임</div>
                </div>
                <div class="header-right">
                    <div id="connection-status" style="font-size:0.75rem; color:var(--text-secondary); margin-right:10px; font-weight:bold;">🟡 접속 중...</div>
                    <div class="tabs">
                        <button class="tab-btn active" id="tab-matches" onclick="switchTab('matches')">매치</button>
                        <button class="tab-btn" id="tab-settings" onclick="switchTab('settings')">설정</button>
                    </div>
                    <button class="reset-btn" onclick="resetAllData()">데이터 초기화</button>
                </div>
            </div>
            
            <div class="player-stats-container" id="player-stats">
                <!-- 선수 스탯 렌더링 -->
            </div>
        </header>

        <main class="content-area">
            <!-- 매치 리스트 (기본) -->
            <div class="matches-container active-tab" id="matches-container">
                <!-- 매치 리스트 렌더링 -->
            </div>
            
            <div id="load-more-container" style="text-align:center; margin-top: 1rem; display: none;">
                <button class="generate-btn" style="width:auto; padding: 0.8rem 2rem; font-size: 1rem;" onclick="loadMoreMatches()">+ 10게임 더 만들기 (More)</button>
            </div>

            <!-- 설정 화면 -->
            <div class="settings-container" id="settings-container">
                <div class="settings-card">
                    <h2>선수 정보 입력</h2>
                    <p class="settings-desc">이름과 부수(숫자)를 입력하세요. 부수가 낮을수록 실력이 높습니다.</p>
                    
                    <div id="players-input-list">
                        <!-- 동적 입력 폼 -->
                    </div>
                    
                    <button class="add-player-btn" onclick="addPlayerInput()">+ 선수 추가</button>
                    
                    <div class="game-count-setting">
                        <label for="game-count">생성할 게임 수:</label>
                        <input type="number" id="game-count" value="10" min="1" max="100">
                    </div>

                    <button class="generate-btn" onclick="applySettingsAndGenerate()">새 매치 생성하기</button>
                </div>
            </div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="script.js?v=5"></script>
</body>
</html>
